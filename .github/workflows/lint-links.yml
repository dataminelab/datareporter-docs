name: Lint Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trailing-slash:
    name: Enforce trailing slashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check trailing slashes on internal links
        run: bash .github/scripts/check-trailing-slashes.sh
