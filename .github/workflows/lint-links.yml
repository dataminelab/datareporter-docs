name: Lint Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trailing-slash:
    name: Enforce trailing slashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check trailing slashes on internal links
        run: bash .github/scripts/check-trailing-slashes.sh
