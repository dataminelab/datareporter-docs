name: Lint Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trailing-slash:
    name: Enforce trailing slashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check trailing slashes on internal links
        run: bash .github/scripts/check-trailing-slashes.sh
