name: Lint Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trailing-slash:
    name: Enforce trailing slashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check trailing slashes on internal links
        run: bash .github/scripts/check-trailing-slashes.sh
